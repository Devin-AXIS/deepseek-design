name: Native studio CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      installed_archive_run:
        description: 'Optional completed build run: verify its Windows-built archive on macOS'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: native-studio-${{ github.ref }}-${{ inputs.installed_archive_run }}
  cancel-in-progress: true
jobs:
  check:
    if: ${{ !inputs.installed_archive_run }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run pack:plugins
      - uses: pnpm/action-setup@v4
        if: runner.os != 'Linux'
        with:
          version: "11.28.5"
          run_install: false
      - run: npm install --prefix .runtime/host --ignore-scripts @deepseek-ai/dsh@0.2.2-rc.3
        if: runner.os != 'Linux'
      - run: npx playwright-core install chromium
        if: runner.os != 'Linux'
      - run: node scripts/native-smoke.mjs
        if: runner.os != 'Linux'
        env:
          DSH_CLI: .runtime/host/node_modules/@deepseek-ai/dsh/lib/bin.js
          STUDIO_SMOKE_CASES: design
          STUDIO_SMOKE_APPROVE_RUNTIME_BUILDS: "1"
          STUDIO_SMOKE_DESIGN_CONVERSATION: "1"
          DSH_PICKER_PATCH: tests/browser/picker.overlay.yml
      - uses: actions/upload-artifact@v4
        if: always() && runner.os != 'Linux'
        with:
          name: design-conversation-${{ matrix.os }}
          path: .runtime/browser-verification/
      - uses: actions/upload-artifact@v4
        with:
          name: native-studio-${{ matrix.os }}
          path: artifacts/*.tgz
  host-smoke:
    if: ${{ !inputs.installed_archive_run }}
    runs-on: ubuntu-latest
    env:
      # Editor smoke uses the bundled CPU runtime; optional CUDA downloads are unrelated.
      ONNXRUNTIME_NODE_INSTALL: skip
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: pnpm/action-setup@v4
        with:
          version: "11.28.5"
          run_install: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - run: npm ci --ignore-scripts
      - run: npm run build && npm run pack:plugins
      - run: npm install --prefix .runtime/host --ignore-scripts @deepseek-ai/dsh@0.2.2-rc.3
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:browser
      - run: node scripts/native-smoke.mjs
        env:
          DSH_CLI: .runtime/host/node_modules/.bin/dsh
          STUDIO_SMOKE_APPROVE_RUNTIME_BUILDS: "1"
          STUDIO_BROWSER_TESTS: "1"
          DSH_PICKER_PATCH: tests/browser/picker.overlay.yml
  installed-archive-macos:
    if: ${{ inputs.installed_archive_run }}
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: pnpm/action-setup@v4
        with:
          version: "11.28.5"
          run_install: false
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: native-studio-windows-latest
          path: artifacts
          run-id: ${{ inputs.installed_archive_run }}
          github-token: ${{ github.token }}
      - run: npm install --prefix .runtime/host --ignore-scripts @deepseek-ai/dsh@0.2.2-rc.3
      - run: npx playwright-core install chromium
      - run: node scripts/native-smoke.mjs
        env:
          DSH_CLI: .runtime/host/node_modules/@deepseek-ai/dsh/lib/bin.js
          STUDIO_SMOKE_CASES: design
          STUDIO_SMOKE_APPROVE_RUNTIME_BUILDS: "1"
          STUDIO_SMOKE_DESIGN_CONVERSATION: "1"
          DSH_PICKER_PATCH: tests/browser/picker.overlay.yml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-conversation-macos-shared-archive
          path: .runtime/browser-verification/
